name: tutor-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: tutor
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tutor -d tutor']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. MinIO images are no longer published to public registries,
  # so RustFS (MinIO-compatible S3 server) is used; the app only speaks the S3 API.
  s3:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    ports:
      - '127.0.0.1:${S3_PORT:-9000}:9000'
      - '127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - s3data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'dist/apps/api/src/main.js']
    env_file: .env
    environment:
      NODE_ENV: production
      LOG_PRETTY: 'false'
      DATABASE_URL: postgres://tutor:tutor@postgres:5432/tutor
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:9000
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started
    profiles: ['app']

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'dist/apps/worker/src/main.js']
    env_file: .env
    environment:
      NODE_ENV: production
      LOG_PRETTY: 'false'
      DATABASE_URL: postgres://tutor:tutor@postgres:5432/tutor
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started
    profiles: ['app']

volumes:
  pgdata:
  redisdata:
  s3data:
