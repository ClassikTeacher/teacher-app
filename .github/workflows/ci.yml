name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose config --quiet
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:unit
      - name: Integration tests (Testcontainers)
        run: pnpm test:integration
      - run: pnpm audit --audit-level=high
        continue-on-error: true
      - run: pnpm build

  images:
    name: build docker images
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api/worker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: tutor-platform/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Smoke test the image
        run: |
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_USER=t -e POSTGRES_PASSWORD=t -e POSTGRES_DB=t postgres:16-alpine
          docker run -d --name redis --network smoke redis:7-alpine
          docker run -d --name s3 --network smoke -e RUSTFS_ACCESS_KEY=k -e RUSTFS_SECRET_KEY=smoke-secret-key rustfs/rustfs:1.0.3
          sleep 8
          docker run -d --name api --network smoke -p 3000:3000             -e NODE_ENV=production -e TELEGRAM_MODE=off -e SYSTEM_KEY_HASH=$(printf 'x' | sha256sum | cut -d' ' -f1)             -e PUBLIC_BASE_URL=https://example.invalid -e JWT_SECRET=$(openssl rand -hex 32)             -e DATABASE_URL=postgres://t:t@pg:5432/t -e REDIS_URL=redis://redis:6379             -e S3_ENDPOINT=http://s3:9000 -e S3_ACCESS_KEY=k -e S3_SECRET_KEY=smoke-secret-key             tutor-platform/backend:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/health && exit 0; sleep 2; done
          docker logs api; exit 1
